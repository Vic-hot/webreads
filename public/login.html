<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 私人书库</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23a9743f'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='%23fbf7ef' font-family='Georgia'>书</text></svg>" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="mark">📚</div>
      <h1>私人书库</h1>
      <p class="sub">输入密码进入你的书库</p>
      <form id="loginForm" autocomplete="off">
        <div class="error" id="loginError"></div>
        <label for="password">访问密码</label>
        <input type="password" id="password" name="password" placeholder="请输入访问密码" required />
        <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">进入书库</button>
      </form>
      <p class="login-hint">密码由书库所有者设置，数据仅存储在你的 Cloudflare 账号下。</p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
